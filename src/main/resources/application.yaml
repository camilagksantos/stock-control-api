spring:
  application:
    name: stock-control-api

  datasource:
    url: jdbc:h2:mem:stockcontrol
    driverClassName: org.h2.Driver
    username: sa
    password:

    h2:
      console:
        enabled: true
        path: /h2-console

    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: create-drop
      show-sql: true
      properties:
        hibernate:
          format_sql: true

server:
  port: 8080

jwt:
  secret: minha-chave-secreta-super-segura-para-assinar-tokens-jwt-2025
  expiration: 86400000